services:
  postgres:
    image: ${MCWEB_ACCEPTANCE_POSTGRES_IMAGE:-postgres:18.4-trixie}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MCWEB_ACCEPTANCE_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: ${MCWEB_ACCEPTANCE_REDIS_IMAGE:-redis:8.8.1-alpine3.23}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: ${MCWEB_ACCEPTANCE_MINIO_IMAGE:-mcweb-acceptance-minio:local}
    build:
      context: ../..
      dockerfile: deploy/acceptance/minio.Dockerfile
      args:
        MINIO_REF: RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MCWEB_ACCEPTANCE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MCWEB_ACCEPTANCE_S3_SECRET_KEY}
    command:
      - server
      - --address
      - ":9000"
      - --certs-dir
      - /acceptance/certs
      - /data
    volumes:
      - minio_data:/data
      - acceptance_workspace:/acceptance:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--insecure", "https://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 60

  acceptance-runner:
    image: ${MCWEB_ACCEPTANCE_RUNNER_IMAGE:?MCWEB_ACCEPTANCE_RUNNER_IMAGE is required}
    working_dir: /workspace
    command: ["bash", "scripts/run-production-acceptance.sh"]
    user: "10002:10002"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      CI: "1"
      MCWEB_ACCEPTANCE_EXECUTION_MODE: compose-runner
      MCWEB_ACCEPTANCE_POSTGRES_PASSWORD: ${MCWEB_ACCEPTANCE_POSTGRES_PASSWORD}
      MCWEB_ACCEPTANCE_S3_ACCESS_KEY: ${MCWEB_ACCEPTANCE_S3_ACCESS_KEY}
      MCWEB_ACCEPTANCE_S3_SECRET_KEY: ${MCWEB_ACCEPTANCE_S3_SECRET_KEY}
      MCWEB_IMAGE_PACKS_PATH: /var/lib/mcweb/image_packs.yml
      MCWEB_IMAGE_PACKS_EXAMPLE_PATH: /workspace/config/image_packs.yml.example
      MCWEB_TEMPLATE_DIR: /var/lib/mcweb/templates
      BOOTSNAP_CACHE_DIR: /tmp/bootsnap
      NO_PROXY: postgres,redis,minio
      no_proxy: postgres,redis,minio
    volumes:
      - acceptance_workspace:/acceptance
      - acceptance_runtime:/var/lib/mcweb

volumes:
  acceptance_runtime:
  acceptance_workspace:
  postgres_data:
  minio_data:

networks:
  default:
    internal: true
