services:
  postgres:
    image: ${MCWEB_ACCEPTANCE_POSTGRES_IMAGE:-postgres:18.4-trixie}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MCWEB_ACCEPTANCE_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: ${MCWEB_ACCEPTANCE_REDIS_IMAGE:-redis:8.8.1-alpine3.23}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: ${MCWEB_ACCEPTANCE_MINIO_IMAGE:-mcweb-acceptance-minio:local}
    build:
      context: ../..
      dockerfile: deploy/acceptance/minio.Dockerfile
      args:
        MINIO_REF: RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MCWEB_ACCEPTANCE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MCWEB_ACCEPTANCE_S3_SECRET_KEY}
    command:
      - server
      - --address
      - ":9000"
      - --certs-dir
      - /certs
      - /data
    ports:
      - "127.0.0.1::9000"
    volumes:
      - minio_data:/data
      - ${MCWEB_ACCEPTANCE_CERTS_DIR}:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--insecure", "https://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  postgres_data:
  minio_data:
