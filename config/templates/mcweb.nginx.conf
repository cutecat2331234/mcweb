# McWeb — nginx reverse proxy + Let's Encrypt (certbot) TLS termination
#
# This template replaces the former Caddyfile. HTTPS certificates are issued and
# auto-renewed by certbot (Let's Encrypt); nginx only terminates TLS and reverse
# proxies to Puma on 127.0.0.1:3000.
#
# bin/install / quick-install.sh substitute `example.com` with the real domain,
# deploy this file to /etc/nginx/sites-available/mcweb and symlink it into
# /etc/nginx/sites-enabled/. Certificates live under /etc/letsencrypt/live/<domain>/.

# --- HTTP :80 — ACME HTTP-01 challenge + redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # certbot webroot challenge. Must stay reachable over plain HTTP for both the
    # first issuance and every automatic renewal, so it is NOT redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — TLS termination + reverse proxy to Puma ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # certbot (Let's Encrypt) certificate paths.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Modern TLS. Mozilla "intermediate" profile.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:MozSSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Security headers (ported verbatim from the previous Caddyfile).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # Upload ceiling. App-side limits: forum attachments default 10 MB (admin can
    # raise via forum.attachments.max_size_mb), store uploads 8 MB, avatars 2 MB.
    # 50m leaves headroom so nginx never rejects an upload the app would accept.
    client_max_body_size 50m;

    # Response compression (matches the old Caddy `encode gzip`).
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      application/javascript application/json application/xml
                    application/rss+xml application/atom+xml image/svg+xml
                    text/css text/plain text/xml font/ttf font/otf application/wasm;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserve original request info so Rails derives the correct scheme/host/IP
        # (MCWEB_ASSUME_SSL relies on X-Forwarded-Proto).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
